name: Materialize reviewed model defaults
on:
  push:
    branches: [codex/sol61-english-defaults]
    paths: [.github/workflows/codex-materialize.yml, .codex-publication/**]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed changes and verify content hashes
        run: python .codex-publication/materialize.py
      - name: Publish reviewed changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make GPT-6.1 Sol the default with Gemini and Kimi backups'
          git push origin HEAD:codex/sol61-english-defaults
